cache:
  paths:
    - node_modules/
    - .npm/

default:
  image: node:alpine

stages:
  - lint
  - build
  - test
  - deploy

linting:
  stage: lint
  script:
    - npm ci
    - npm run lint

build-app:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/

run-unit-tests:
  stage: test
  script:
    - npm ci
    - npm run test

run-e2e-tests:
  stage: test
  image: python:3.12
  script:
    - pip install selenium webdriver-manager
    - python3 Scripts/test-kanban-view.py

deploy-to-dev:
  stage: deploy
  only:
    - dev
  needs:
    - job: build
      artifacts: true
  script:
    - rsync -av dist/ "$DEV_USER@$DEV_HOST:/var/www/$APP_NAME"

deploy-to-prod:
  stage: deploy
  only:
    - main
  needs:
    - job: build
      artifacts: true
  script:
    - rsync -av dist/ "$PROD_USER@$PROD_HOST:/var/www/$APP_NAME"

include:
  - <fully-qualified-domain-name>/<project-path>/<component-name>@<specific-version>

child_a:
  stage: deploy
  trigger:
    include: "some pipeline 1"
  rules:
    if: "$CI_COMMIT_TAG"

child_b:
  stage: deploy
  trigger:
    include: "some pipeline 2"
  rules:
    if: '$CI_COMMIT_BRANCH == "main"'
