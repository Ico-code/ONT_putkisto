default:
  image: node:alpine
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  a11y_urls: http://$DEV_HOST

stages:
  - quality-check
  - accessibility
  - build
  - test
  - deploy

include:
  - template: Code-Quality.gitlab-ci.yml
  - template: Verify/Accessibility.gitlab-ci.yml

a11y:
  stage: accessibility
  before_script: []
  cache: []
  needs: []

code_quality:
  stage: quality-check
  before_script: []
  cache: []

linting-check:
  stage: quality-check
  script:
    - npm run lint > lint-output.txt 2>&1
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - lint-output.txt

formatting-check:
  stage: quality-check
  script:
    - npm run format:check

build-app:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/

run-unit-tests:
  stage: test
  needs:
    - job: linting-check
    - job: formatting-check
    - job: code_quality
  script:
    - npm run test
  coverage: '/Code coverage: \d+(?:\.\d+)?/'

run-e2e-tests:
  stage: test
  before_script:
    - apk add --no-cache chromium chromium-chromedriver python3 py3-pip
    - pip install --no-cache-dir --break-system-packages selenium
  script:
    - npx --yes serve -s dist -l 4173 &
    - sleep 3
    - export CHROME_BIN=/usr/bin/chromium-browser
    - export APP_URL=http://127.0.0.1:4173/projects/p1
    - python3 Scripts/test-kanban-view.py

deploy-to-dev:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apk add --no-cache rsync openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEV_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEV_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - rsync -av --delete -e "ssh -i ~/.ssh/id_ed25519" dist/ "$DEV_USER@$DEV_HOST:/var/www/$APP_NAME/"
  environment:
    name: development
    url: http://$DEV_HOST

deploy-to-prod:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "prod"'
      when: manual
      allow_failure: false
  before_script:
    - apk add --no-cache rsync openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$PROD_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$PROD_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - rsync -av --delete -e "ssh -i ~/.ssh/id_ed25519" dist/ "$PROD_USER@$PROD_HOST:/var/www/$APP_NAME/"
  environment:
    name: production
    url: https://$PROD_HOST
